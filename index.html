    <link rel="icon" type="image/png" href="assets/favicon.png">

<body>
    <nav class="navbar navbar-expand navbar-dark px-3 px-md-5">

        <div class="ms-auto d-flex gap-3">
            <a class="nav-link" href="https://www.tiktok.com/@imnot_angel14" target="https://www.tiktok.com/@imnot_angel14">TikTok</a>

        <div class="container-fluid">

            </div>

        <p class="text-muted small mb-0">

    </footer>
    <script src="index.js"></script>
    <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
    <script>
    kofiWidgetOverlay.draw('imnotangel14', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': 'Support me',
        'floating-chat.donateButton.background-color': '#fff',
        'floating-chat.donateButton.text-color': '#000'
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
